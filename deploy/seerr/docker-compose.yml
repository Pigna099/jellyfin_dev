services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2
    container_name: seerr
    init: true
    restart: unless-stopped
    # Host network: serve per raggiungere Jellyfin/Radarr su 127.0.0.1 senza
    # aprire regole ufw per la rete Docker. La 5056 resta solo LAN/VPN.
    network_mode: host
    environment:
      TZ: Europe/Rome
      PORT: "5056"
      LOG_LEVEL: info
    volumes:
      - /srv/seerr/config:/app/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5056/api/v1/settings/public || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
